<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b66"><title>RSM-EMLAK</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="wrap">
<header><div><div class="eyebrow">RSM GAYRİMENKUL</div><h1>RSM-EMLAK</h1><p>Kişiler, taşınmazlar ve sözleşmeler tek yerde.</p></div><span id="connection" class="pill">Bağlantı kontrol ediliyor</span></header>
<section id="authPanel" class="panel"><h2>RSM-EMLAK Girişi</h2><p id="authMessage">E-posta adresiniz ve parolanızla giriş yapın veya yeni hesap oluşturun.</p><form id="authForm"><div class="fields"><label>E-posta<input name="email" type="email" autocomplete="username" required></label><label>Parola<input name="password" type="password" autocomplete="current-password" minlength="12" required></label></div><div class="form-actions"><button type="submit" id="loginButton">Giriş yap</button><button type="button" id="registerButton" class="secondary">Yeni hesap oluştur</button></div></form></section>
<section id="workspace" class="hidden"><div class="toolbar"><span id="who"></span><div class="actions"><button id="backup" class="secondary">Yedek indir</button><button id="checkBackup" type="button" class="secondary">Yedeği kontrol et</button><input id="backupFile" type="file" accept=".json,application/json" class="hidden"><button id="logout" class="secondary">Çıkış</button></div></div>
<nav><button data-tab="people" class="active">Kişiler</button><button data-tab="properties">Taşınmazlar</button><button data-tab="contracts">Sözleşmeler</button></nav>
<div class="panel"><div class="section-head"><h2 id="sectionTitle">Kişiler</h2><input id="search" placeholder="Listede ara…"></div><form id="recordForm"><div id="fields" class="fields"></div><div class="form-actions"><button type="submit">Kaydet</button><button type="button" id="cancelEdit" class="secondary hidden">Düzenlemeyi iptal et</button><span id="saveMessage" class="hint"></span></div></form><div id="records" class="records"></div></div><p class="footnote">Kayıt silme kapalıdır. Verilerinizi düzenli olarak yedekleyin.</p></section>
<footer>RSM-EMLAK • Güvenli bulut sürümü</footer></main><script type="module" src="/app.js"></script></body></html>
